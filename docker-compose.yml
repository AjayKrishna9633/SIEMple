services:
  redis:
    image: redis:7-alpine
    container_name: siemple-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  server:
    build: ./server
    container_name: siemple-server
    env_file:
      - ./server/.env
    ports:
      - "4000:4000"
    depends_on:
      - redis

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: siemple-client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  redis-data:
